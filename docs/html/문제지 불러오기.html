<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문제지 생성 (UI 개선)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="min-h-screen flex flex-col">
        <!-- 상단 헤더 -->
        <header class="bg-white border-b sticky top-0 z-20">
            <div class="max-w-screen-2xl mx-auto px-6 py-3 flex justify-between items-center">
                <h1 class="text-xl font-bold text-gray-800">문제지 생성</h1>
                <div class="flex items-center gap-3">
                    <button class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md text-sm font-semibold hover:bg-gray-50 flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                        지문 추가
                    </button>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-blue-700 flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        저장하기
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="flex-1 max-w-screen-2xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 왼쪽: 아름답게 디자인된 지문 불러오기 패널 -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col">
                 <div>
                    <label for="test-name" class="block text-base font-bold text-gray-800 mb-2">문제지 이름 <span class="text-red-500">*</span></label>
                    <input type="text" id="test-name" placeholder="작업이름을 입력해 주세요." class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                
                <!-- 지문 불러오기 UI 개선 -->
                <div class="mt-8 flex-1 flex flex-col items-center justify-center text-center p-6 bg-gradient-to-br from-blue-50 via-white to-purple-50 rounded-xl shadow-inner border border-gray-200/50">
                    <!-- SVG 일러스트 -->
                    <div class="mb-5">
                         <svg class="w-32 h-32" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                            <g transform="translate(100 100)">
                                <path d="M54.5,-23.3C64.9,1.5,63.6,31.8,47.8,48.2C32,64.6,1.7,67.1,-24.8,56.7C-51.3,46.2,-73.9,22.8,-73.9,-2.4C-73.9,-27.6,-51.3,-55.1,-27.8,-63.9C-4.3,-72.7,20.1,-62.7,37.3,-47.9C54.5,-33.1,64.9,-13.2,64.9,1.5L54.5,-23.3Z" fill="#e9d5ff"></path>
                                <path d="M55.8,-27.3C65.3,-6,62,18.4,48.4,35.1C34.9,51.9,11,61,-12.7,59.1C-36.4,57.1,-60,44.1,-66.8,25.8C-73.6,7.5,-63.6,-16,-48.5,-32.8C-33.4,-49.6,-13.2,-59.7,7.8,-61.7C28.8,-63.7,50.6,-57.8,55.8,-27.3Z" transform="rotate(15)" fill="#dbeafe"></path>
                                <foreignObject x="-50" y="-50" width="100" height="100">
                                    <div class="w-full h-full flex items-center justify-center">
                                       <svg class="w-16 h-16 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                                        </svg>
                                    </div>
                                </foreignObject>
                            </g>
                        </svg>
                    </div>

                    <h3 class="text-xl font-bold text-gray-800">새로운 문제지 만들기</h3>
                    <p class="mt-2 text-sm text-gray-500 max-w-xs">만들어 둔 지문을 불러와<br>쉽고 빠르게 문제지를 생성해 보세요.</p>
                    
                    <button id="open-modal-btn" class="mt-8 bg-blue-600 text-white font-bold py-3 px-8 rounded-lg shadow-md hover:bg-blue-700 hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300 ease-in-out flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                        지문 불러오기
                    </button>
                </div>
            </aside>

            <!-- 오른쪽: 축소된 A4 미리보기 패널 -->
            <div class="lg:col-span-2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <!-- 툴바 -->
                <div class="p-2 border-b border-gray-200 bg-gray-50/50 flex items-center justify-between text-gray-600 flex-wrap gap-2 z-10">
                    <!-- ... 툴바 내용은 이전과 동일 ... -->
                </div>
                
                <!-- A4 용지 뷰어 컨테이너 (스크롤 방지 및 중앙 정렬) -->
                <div class="flex-1 p-4 md:p-8 overflow-hidden bg-gray-100/50 flex justify-center items-center">
                    <!-- A4 용지 시트 (컨테이너 크기에 맞춰 자동 축소) -->
                    <div class="w-full h-full max-w-full max-h-full bg-white px-8 py-12 shadow-xl flex flex-col aspect-[210/297]">
                        <!-- 세분화된 머리말 입력 영역 -->
                        <header class="border-b-2 border-dashed border-gray-300 pb-4 mb-4">
                           <div class="flex justify-between items-center gap-4">
                               <input type="text" placeholder="좌상단" class="w-1/3 p-1 text-xs text-left border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                               <input type="text" placeholder="중앙" class="w-1/3 p-1 text-xs text-center border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                               <input type="text" placeholder="우상단" class="w-1/3 p-1 text-xs text-right border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                           </div>
                        </header>
                        
                        <!-- 빈 콘텐츠 영역 -->
                        <div class="flex-grow flex items-center justify-center text-center text-gray-400">
                            <div class="opacity-50">
                                <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                                </svg>
                                <p class="mt-4 text-sm">지문을 불러오세요</p>
                            </div>
                        </div>

                        <!-- 세분화된 꼬리말 입력 영역 -->
                        <footer class="border-t-2 border-dashed border-gray-300 pt-4 mt-4">
                            <div class="flex justify-between items-center gap-4">
                               <input type="text" placeholder="좌하단" class="w-1/3 p-1 text-xs text-left border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                               <input type="text" placeholder="중앙" class="w-1/3 p-1 text-xs text-center border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                               <input type="text" placeholder="우하단" class="w-1/3 p-1 text-xs text-right border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                           </div>
                        </footer>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ... 모달 및 스크립트는 이전과 동일 ... -->
</body>
</html>
