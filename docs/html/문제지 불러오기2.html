<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문제지 생성 (A4 비율 적용)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
    </style>
</head>
<body class="bg-gray-50">

    <div class="min-h-screen flex flex-col">
        <!-- 상단 헤더 -->
        <header class="bg-white border-b sticky top-0 z-10">
            <div class="max-w-screen-2xl mx-auto px-6 py-3 flex justify-between items-center">
                <h1 class="text-xl font-bold text-gray-800">문제지 생성</h1>
                <div class="flex items-center gap-3">
                    <button class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md text-sm font-semibold hover:bg-gray-50 flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                        지문 추가
                    </button>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-blue-700 flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        저장하기
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="flex-1 max-w-screen-2xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 왼쪽: 지문 불러오기 패널 -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                 <div>
                    <label for="test-name" class="block text-base font-bold text-gray-800 mb-2">문제지 이름 <span class="text-red-500">*</span></label>
                    <input type="text" id="test-name" placeholder="작업이름을 입력해 주세요." class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                
                <div class="mt-8 border-2 border-dashed border-gray-300 rounded-lg flex flex-col items-center justify-center text-center py-16">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    <button id="open-modal-btn" class="bg-blue-600 text-white px-6 py-2 rounded-md font-semibold hover:bg-blue-700 transition flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                        지문 불러오기
                    </button>
                    <p class="mt-3 text-sm text-gray-500">지문을 불러와 문제를 생성해 보세요.</p>
                </div>
            </aside>

            <!-- 오른쪽: 문제지 미리보기 (A4 비율 적용) -->
            <div class="lg:col-span-2 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col">
                <!-- 확장된 텍스트 에디터 툴바 -->
                <div class="p-2 border-b border-gray-200 bg-gray-50/50 flex items-center justify-between text-gray-600 flex-wrap gap-2">
                    <!-- ... 툴바 내용은 이전과 동일 ... -->
                    <div class="flex items-center gap-1">
                        <button class="p-1.5 hover:bg-gray-200 rounded font-bold">B</button>
                        <button class="p-1.5 hover:bg-gray-200 rounded italic">I</button>
                        <button class="p-1.5 hover:bg-gray-200 rounded underline">U</button>
                        <button class="p-1.5 hover:bg-gray-200 rounded line-through">S</button>
                        <div class="w-px h-5 bg-gray-300 mx-1"></div>
                        <button class="p-1.5 hover:bg-gray-200 rounded"><svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg></button>
                        <button class="p-1.5 hover:bg-gray-200 rounded"><svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 7a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg></button>
                        <button class="p-1.5 hover:bg-gray-200 rounded"><svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 9a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg></button>
                    </div>
                </div>
                
                <!-- A4 용지 컨테이너 -->
                <div class="flex-1 p-8 overflow-y-auto bg-gray-100/50 flex justify-center">
                    <!-- A4 용지 시트 -->
                    <div class="w-full max-w-4xl bg-white px-8 py-12 shadow-2xl flex flex-col aspect-[210/297]">
                        <!-- 세분화된 머리말 입력 영역 -->
                        <header class="border-b-2 border-dashed border-gray-300 pb-4 mb-4">
                           <div class="flex justify-between items-center gap-4">
                               <input type="text" placeholder="좌상단 머리말" class="w-1/3 p-1 text-xs text-left border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                               <input type="text" placeholder="중앙 머리말" class="w-1/3 p-1 text-xs text-center border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                               <input type="text" placeholder="우상단 머리말" class="w-1/3 p-1 text-xs text-right border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                           </div>
                        </header>
                        
                        <!-- 빈 콘텐츠 영역 -->
                        <div class="flex-grow flex items-center justify-center text-center text-gray-400">
                            <div class="py-20">
                                <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                                </svg>
                                <p class="mt-4 text-base">왼쪽에서 지문을 불러오면</p>
                                <p class="text-base">여기에 문제가 표시됩니다.</p>
                            </div>
                        </div>

                        <!-- 세분화된 꼬리말 입력 영역 -->
                        <footer class="border-t-2 border-dashed border-gray-300 pt-4 mt-4">
                            <div class="flex justify-between items-center gap-4">
                               <input type="text" placeholder="좌하단 꼬리말" class="w-1/3 p-1 text-xs text-left border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                               <input type="text" placeholder="중앙 꼬리말" class="w-1/3 p-1 text-xs text-center border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                               <input type="text" placeholder="우하단 꼬리말" class="w-1/3 p-1 text-xs text-right border-none bg-gray-50 rounded-sm focus:ring-1 focus:ring-blue-400 placeholder-gray-400">
                           </div>
                        </footer>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ... 모달 및 스크립트는 이전과 동일 ... -->
</body>
</html>
